      fillFromCandidate(attached);
    };
  }

  document.getElementById("f-save").onclick = e => {
    const g = id => (document.getElementById(id)||{}).value;
    const provider = (g("f-provider")||"").trim();
    if(!provider){ toast("Add a provider or person first."); return; }
    if(attached && attached.checks.reasons.length && g("f-status")==="counted"){
      if(!confirm("This may already be tracked.\n\n"+attached.checks.reasons.join("\n")+"\n\nAdd it anyway?")) return;
    }
    const patch = { type:g("f-type"), provider, date:g("f-date")||todayISO(), amount:round2(Number(g("f-amount"))||0),
      paidBy:g("f-paidby"), status:g("f-status"), periodStart:g("f-ps")||"", periodEnd:g("f-pe")||"",
      notes:g("f-notes")||"", source:g("f-source")||"", updatedAt:nowISO(), by:me()||"" };
    /* Only present for shopping. Absent means shared, which is the safe default and
     * matches how an entry written before this field existed is read. */
    if(document.getElementById("f-shared")) patch.shared = g("f-shared")!=="personal";
    const id = e.currentTarget.dataset.id, cid = e.currentTarget.dataset.cid;
    if(id){ Object.assign(state.items.find(x=>x.id===id), patch); toast("Updated. Balance recalculated."); }
    else {
      state.items.push(Object.assign({id:uid("m")},patch));
      if(attached) logUpload(attached, patch.status==="counted"?"added":"pending",
        patch.status==="counted"?"Added as counted":"Added as pending");
      toast(patch.status==="counted"?"Added. Balance updated.":"Added to "+STATUS_LABEL[patch.status].toLowerCase()+".");
    }
    if(cid) reviewQueue = reviewQueue.filter(x=>x.cid!==cid);
    attached = null;
    save(); closeSheet(); render();
  };
}

function assumeSheet(idx){
  const a = state.assumptions.monthly[idx];
  openSheet(`<h3>${esc(a.provider)}</h3><p class="lead">Sets the monthly estimate only. It does not change the balance.</p>
    <div class="two">
      <div class="f"><label>Amount a month</label><input type="number" step="0.01" inputmode="decimal" id="a-amt" value="${a.amount}"></div>
      <div class="f"><label>Paid on day</label><input type="number" min="1" max="31" inputmode="numeric" id="a-day" value="${a.payDay||""}"></div>
    </div>
    <div class="f"><label>Paid by</label><select id="a-by">${["Ale","Amira"].map(p=>`<option ${a.paidBy===p?"selected":""}>${p}</option>`).join("")}</select></div>
    <div class="f"><label>Note</label><textarea id="a-note">${esc(a.note||"")}</textarea></div>
    <button class="btn pri" id="a-save" data-idx="${idx}">Save</button>
    <button class="btn qui" data-close>Cancel</button>`);
  document.getElementById("a-save").onclick = () => {
    const g = id => (document.getElementById(id)||{}).value;
    a.amount = round2(Number(g("a-amt"))||0);
    a.payDay = Number(g("a-day"))||null;
    a.paidBy = g("a-by"); a.note = g("a-note")||"";
    state.assumptionsUpdatedAt = nowISO();
    save(); closeSheet(); render(); toast("Saved. Monthly estimate updated.");
  };
}

/* ------------------------------------------------------- sync sheet */
function syncSheet(onDone){
  const c = syncCfg()||{ owner:"", repo:"household-ledger", path:"ledger.json", branch:"main", token:"" };
  openSheet(`<h3>Shared sync</h3>
    <p class="lead">Both phones point at one private GitHub repository. Only encrypted data is sent.</p>
    <div class="f"><label>GitHub username</label><input id="s-owner" value="${esc(c.owner)}" placeholder="your-username" autocapitalize="none" autocorrect="off"></div>
    <div class="f"><label>Repository name</label><input id="s-repo" value="${esc(c.repo)}" placeholder="household-ledger" autocapitalize="none" autocorrect="off"></div>
    <div class="f"><label>Access token</label><input id="s-token" type="password" value="${esc(c.token||"")}" placeholder="github_pat_…" autocapitalize="none" autocorrect="off">
      <div class="h">Fine-grained token with Contents set to Read and write on that one repository.</div></div>
    <div class="two">
      <div class="f"><label>File</label><input id="s-path" value="${esc(c.path||"ledger.json")}" autocapitalize="none"></div>
      <div class="f"><label>Branch</label><input id="s-branch" value="${esc(c.branch||"main")}" autocapitalize="none"></div>
    </div>
    <button class="btn pri" id="s-save">${onDone?"Connect and load":"Save and sync"}</button>
    ${syncCfg()?`<button class="btn des" id="s-off">Disconnect this device</button>`:""}
    <button class="btn qui" data-close>Cancel</button>`);
  const g = id => (document.getElementById(id)||{}).value.trim();
  const off = document.getElementById("s-off");
  if(off) off.onclick = () => { setSyncCfg(null); syncSha=null; syncMsg=""; closeSheet(); render(); toast("Sync turned off on this device."); };
  document.getElementById("s-save").onclick = async () => {
    const cfg = { owner:g("s-owner"), repo:g("s-repo"), token:g("s-token"), path:g("s-path")||"ledger.json", branch:g("s-branch")||"main" };
    if(!cfg.owner||!cfg.repo||!cfg.token){ toast("Fill in username, repository and token."); return; }
    toast("Checking the repository…");
    try{
      if(onDone){ await syncAdopt(cfg); closeSheet(); onDone(); return; }
      setSyncCfg(cfg); syncSha = null;
      const ok = await syncNow({render:false});
      closeSheet(); render();
      toast(ok ? "Sync is on." : (syncMsg||"Could not reach the repository."));
    }catch(e){ toast(e.message||"Could not reach the repository."); }
  };
}

/* --------------------------------------------------------- security */
async function securityAction(what){
  if(what==="lock") return lockNow();
  if(what==="bio"){
    const a = readAuth()||{};
    if(a.credId){
      if(!confirm("Turn this off? You will need your passcode each time.")) return;
      bioDisable(); render(); toast("Turned off."); return;
    }
    if(!(await bioAvailable())) return toast(await bioReason());
    try{ await bioEnable(); render(); toast("Turned on."); }
    catch(e){ toast("Could not set it up: "+(e && e.name ? e.name : "unknown")+". Your passcode still works."); }
    return;
  }
  if(what==="change"){
    openSheet(`<h3>Change passcode</h3><p class="lead">You will need the current one first.</p>
      <div class="f"><label>Current passcode</label><input type="password" id="c0" autocomplete="current-password"></div>
      <div class="f"><label>New passcode</label><input type="password" id="c1" autocomplete="new-password"></div>
      <div class="f"><label>Repeat new passcode</label><input type="password" id="c2" autocomplete="new-password"></div>
      <button class="btn pri" id="cSave">Change passcode</button>
      <button class="btn qui" data-close>Cancel</button>`);
    document.getElementById("cSave").onclick = async () => {
      const g = id => document.getElementById(id).value;
      const a = readAuth();
      if(g("c1").length < 4) return toast("Use at least 4 characters.");
      if(g("c1") !== g("c2")) return toast("The new passcodes do not match.");
      try{
        if(SUB){
          const old = await deriveKey(g("c0"), unb64(a.salt));
          await decJSON(old, a.check);
          const saltB = rand(16);
          CK = await deriveKey(g("c1"), saltB);
          writeAuth({ salt:b64(saltB), iter:ITER, check: await encJSON(CK, {ok:true}), credId:a.credId });
          await persist();
          if(a.credId) localStorage.setItem(BIO_KEY, b64(await SUB.exportKey("raw", CK)));
        } else {
          if(weakHash(g("c0"), a.salt) !== a.weak) throw new Error("bad");
          const salt = b64(rand(16));
          writeAuth({ salt, weak: weakHash(g("c1"), salt), credId:a.credId });
        }
        closeSheet(); toast("Passcode changed.");
      }catch(e){ toast("The current passcode is not right."); }
    };
  }
}

/* ------------------------------------------------------------ events */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-explain],[data-item],[data-prov],[data-filter],[data-add],[data-pick],[data-close],[data-edit],[data-status],[data-del],[data-act],[data-showall],[data-assume],[data-sec],[data-sync],[data-who],[data-blur],[data-menu],[data-bought],[data-appear],#whoBtn,#blurBtn,#themeBtn,#exportBtn,#importBtn,#resetBtn,#sheetBtn");
  if(!t) return;
  const d = t.dataset;
  if(t.id==="blurBtn" || d.blur!==undefined){
    setBlur(!blurOn()); render(); return;
  }
  if(t.id==="themeBtn"){ toggleTheme(); render(); return; }
  if(d.appear){
    setAppearance(d.appear); render();
    toast(APPEARANCES.find(a=>a.id===d.appear).label + " appearance.");
    return;
  }
  if(d.who){                                   // person chosen, on the gate or from Settings
    setMe(d.who);
    if(gateNext){ const n = gateNext; gateNext = null; n(); }
    else { closeSheet(); render(); toast("Now using this as "+d.who+"."); }
    return;
  }
  if(t.id==="whoBtn"){ menuSheet(); return; }
  if(d.sec==="who" || d.menu==="switch"){ whoSheet(); return; }
  if(d.sec){ securityAction(d.sec); return; }
  if(d.sync){
    if(d.sync==="setup") syncSheet();
    else { syncMsg="Syncing…"; render(); syncNow(); }
    return;
  }
  if(t.id==="exportBtn"){
    const b = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="household-bills-"+todayISO()+".json"; a.click(); URL.revokeObjectURL(a.href);
    toast("Backup exported."); return;
  }
  if(t.id==="importBtn"){ document.getElementById("importFile").click(); return; }
  if(t.id==="sheetBtn"){ window.open(state.meta.auditSheet,"_blank","noopener"); return; }
  if(t.id==="resetBtn"){
    if(!confirm("Reset everything back to the 8 August 2026 baseline?")) return;
    state = seedClone(); reviewQueue=[]; save(false); render(); toast("Reset to the baseline."); return;
  }
  if(d.showall!==undefined && t.hasAttribute("data-showall")){ showAll[d.showall]=!showAll[d.showall]; render(); return; }
  /* closeSheet is a no-op when nothing is open, and is needed when the tab was chosen
   * from inside the profile menu rather than the strip. */
  if(d.tab){ tab=d.tab; closeSheet(); render(); return; }
  if(d.filter){ billFilter=d.filter; render(); return; }
  if(d.explain){ explainSheet(d.explain); return; }
  if(d.prov){ provSheet(d.prov); return; }
  if(d.assume!==undefined && t.hasAttribute("data-assume")){ assumeSheet(Number(d.assume)); return; }
  if(d.item){ itemSheet(d.item); return; }
  if(t.hasAttribute("data-add")){
    /* Shopping skips the category tiles: groceries are named, not categorised. */
    if(d.add==="needed") return neededSheet();
    if(d.add==="shared_purchase")
      return formSheet({ type:"shared_purchase", status:"counted", paidBy:me()||"—", date:todayISO() });
    pickerSheet(d.add); return;
  }
  if(d.bought){ boughtSheet(d.bought); return; }
  if(t.hasAttribute("data-pick")){
    const i = d.pick.indexOf(":"), kind = d.pick.slice(0,i), provider = d.pick.slice(i+1);
    if(kind==="pay"){
      formSheet({ type:"housemate_payment", status:"counted",
        provider: provider==="Amira" ? "Amira → Ale" : "Ale → Amira", paidBy: provider });
      return;
    }
    /* Paid by defaults to whoever is signed in on this device, editable in the form like
     * any other field (TRACKER #10). This is not the per-category payer guess TRACKER #9
     * removed: that inferred a payer from the category ("water is Amira's"), which does
     * not generalise. This reads the device's own identity, which is a fact. */
    const def = { provider_bill:{status:"counted"}, pending:{status:"pending_review"}, excluded:{status:"excluded"} };
    formSheet(Object.assign({ type:kind, provider, paidBy: me()||"—" }, def[kind]||{}));
    return;
  }
  if(t.hasAttribute("data-close")){ closeSheet(); return; }
  if(d.edit){ formSheet({item:state.items.find(x=>x.id===d.edit)}); return; }
  if(d.status&&d.sid){
    const it = state.items.find(x=>x.id===d.sid); it.status=d.status; it.updatedAt=nowISO();
    save(); closeSheet(); render();
    toast(d.status==="counted"?"Counted. Balance updated.":"Moved to "+STATUS_LABEL[d.status].toLowerCase()+".");
    return;
  }
  if(d.del){
    if(!confirm("Delete this entry? The balance will recalculate.")) return;
    state.items = state.items.filter(x=>x.id!==d.del);
    state.deleted = state.deleted||{}; state.deleted[d.del] = nowISO();
    save(); closeSheet(); render(); toast("Deleted. Balance updated.");
    return;
  }
  if(d.act&&d.cid){
    if(d.act==="edit"){
      const c = reviewQueue.find(x=>x.cid===d.cid);
      formSheet({type:c.type,provider:c.provider,date:c.date,amount:c.amount,paidBy:c.paidBy,
        periodStart:c.periodStart,periodEnd:c.periodEnd,status:"counted",
        notes:"Added from upload after manual correction.",source:c.fileName+" · "+c.fileHash,cid:c.cid});
      return;
    }
    if(d.act==="add-counted"){
      const c = reviewQueue.find(x=>x.cid===d.cid);
      if(c.checks.verdict!=="new" && !confirm("This may already be tracked.\n\n"+c.checks.reasons.join("\n")+"\n\nAdd it anyway?")) return;
    }
    commitCandidate(d.cid,d.act); return;
  }
});
applyAppearance();
/* While on Automatic the CSS media query already switches the theme on its own; this only
 * keeps the header icon and the status-bar colour in step when the phone flips at sunset. */
try{
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if(appearance()==="auto"){ applyAppearance(); if(!document.body.classList.contains("locked")) render(); }
  });
}catch(e){ /* no matchMedia: Automatic just resolves to light, nothing to listen for */ }
/* The header only becomes glass once there is content behind it to blur.
 * document.addEventListener rather than a bare global, matching the two listeners below. */
document.addEventListener("scroll", () => {
  document.body.classList.toggle("scrolled", (window.scrollY||0) > 4);
}, { passive:true });
document.getElementById("scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });
document.addEventListener("change", e => {
  if(e.target.id!=="importFile"||!e.target.files.length) return;
  const fr = new FileReader();
  fr.onload = () => { try{
      const p = JSON.parse(fr.result); if(!p||!Array.isArray(p.items)) throw 0;
      state = normalise(p); reviewQueue=[]; save(false); render(); toast("Backup imported.");
    }catch(err){ toast("That file could not be read."); } };
  fr.readAsText(e.target.files[0]);
});
boot();
</script>
