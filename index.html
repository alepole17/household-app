<style>
:root{
  color-scheme: light;
  --bg:#f2f2f7;
  --fill:#78788014;
  --fill-2:#7878801f;
  --card:#ffffff;
  --label:#000000;
  --label-2:#3c3c4399;
  --label-3:#3c3c434d;
  --sep:#3c3c431f;
  --blue:#0a72e8;
  --teal:#0f9b8e;
  --orange:#c77700;
  --grey:#8e8e93;
  --purple:#8944ab;
  --green:#1c8c4e;
  --red:#c8322b;
  --r:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--label);
  font-size:17px;line-height:1.4;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;
  padding-bottom:56px;
}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.022em}
p{margin:0}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button *{pointer-events:none}
input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
svg{display:block}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:40;background:#f2f2f7e6;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 0 12px}
.hrow h1{font-size:22px;letter-spacing:-.026em}
.hrow span{font-size:13px;color:var(--label-2)}
.hright{display:flex;align-items:center;gap:10px}
.who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:#fff;font-size:13px;font-weight:600;letter-spacing:0;transition:transform .12s}
.who:active{transform:scale(.92)}
.who.ale{background:var(--blue)} .who.amira{background:var(--teal)}
.segwrap{padding-bottom:12px}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;background:var(--fill);padding:2px;border-radius:9px}
.seg button{white-space:nowrap;font-size:13px;font-weight:500;color:var(--label);padding:6px 4px;border-radius:7px;
  transition:background .2s,box-shadow .2s;overflow:hidden;text-overflow:ellipsis;touch-action:manipulation}
.seg button[aria-selected="true"]{background:#fff;font-weight:590;box-shadow:0 3px 8px #00000014,0 1px 1px #0000000f}
@media(max-width:430px){ .seg button{font-size:11.5px;letter-spacing:-.02em;padding:6px 2px} }

/* grouped lists */
.grp{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.ghead{font-size:12px;font-weight:500;letter-spacing:.01em;text-transform:uppercase;color:var(--label-2);padding:0 16px 7px;margin-top:2px}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;text-align:left;position:relative;background:none;min-height:48px}
.li+.li::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.li.ind+.li::before{left:60px}
button.li:active{background:var(--fill)}
.li .ic{width:29px;height:29px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.li .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.li .tx{flex:1;min-width:0}
.li .t1{font-size:16px;letter-spacing:-.018em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.li .t2{font-size:13px;color:var(--label-2);margin-top:1px;letter-spacing:-.006em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .val{font-size:16px;color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.li .val b{color:var(--label);font-weight:400}
.chev{width:14px;height:14px;flex:none;stroke:var(--label-3);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;margin-left:-2px}
.li.action .t1{color:var(--blue)}
.li.action .ic{background:var(--fill-2);color:var(--blue)}
.gfoot{font-size:13px;color:var(--label-2);padding:7px 16px 0;margin:-16px 0 22px;line-height:1.35}

/* tints */
.t-blue{background:var(--blue)} .t-teal{background:var(--teal)}
.t-grey{background:var(--grey)} .t-orange{background:var(--orange)}
.t-purple{background:var(--purple)}

/* badges */
.bdg{font-size:11px;font-weight:590;padding:1px 6px;border-radius:5px;letter-spacing:0;color:var(--label-2);background:var(--fill-2)}
.bdg.pending_review,.bdg.needs_confirmation{color:var(--orange);background:#c7770016}
.bdg.excluded{color:var(--grey);background:#8e8e9316}
.bdg.duplicate{color:var(--purple);background:#8944ab16}

/* balance */
.bal{background:var(--card);border-radius:16px;padding:26px 20px 20px;text-align:center;margin-bottom:22px}
.bal .cap{font-size:13px;color:var(--label-2)}

<div class="toast" id="toast"></div>

<script>
"use strict";
const STORE_KEY = "household_bills_ale_amira_v2";

/* ------------------------------------------------------------- icons */
const S = (d) => '<svg viewBox="0 0 24 24">'+d+'</svg>';
const ICON = {
  bolt: S('<path d="M13 2.5 5 13.5h6l-1 8 8-11h-6l1-8Z"/>'),
  bank: S('<path d="M12 3.2 20.5 8H3.5L12 3.2Z"/><path d="M6 11v7M10 11v7M14 11v7M18 11v7M3.5 21h17"/>'),
  drop: S('<path d="M12 3.5s5.5 5.9 5.5 9.6a5.5 5.5 0 0 1-11 0C6.5 9.4 12 3.5 12 3.5Z"/>'),
  wifi: S('<path d="M4.5 11.5a11 11 0 0 1 15 0M8 15a6 6 0 0 1 8 0"/><path d="M12 18.6h.01"/>'),
  home: S('<path d="M4 10.8 12 4.2l8 6.6V20a1 1 0 0 1-1 1h-4v-6.2H9V21H5a1 1 0 0 1-1-1v-9.2Z"/>'),
  box:  S('<path d="M3.5 8 12 4l8.5 4v8L12 20l-8.5-4V8Z"/><path d="M3.5 8 12 12l8.5-4M12 12v8"/>'),
  send: S('<path d="M7 17 17 7M8.5 7H17v8.5"/>'),
  doc:  S('<path d="M13.5 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7.5L13.5 3Z"/><path d="M13.5 3v4.5H18"/>'),
  plus: S('<path d="M12 5.5v13M5.5 12h13"/>'),
  up:   S('<path d="M12 20V5M6.5 10.5 12 5l5.5 5.5"/>'),
  down: S('<path d="M12 4v15M6.5 13.5 12 19l5.5-5.5"/>'),
  info: S('<path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M12 11v5M12 8h.01"/>'),
  gear: S('<path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="m19.4 14-.9 1.6.9 1.6-1.9 1.9-1.6-.9-1.6.9-.7 1.9h-2.6l-.7-1.9-1.6-.9-1.6.9L3.2 17l.9-1.6L3.2 14v-2.6l1.9-.7.9-1.6-.9-1.6L7 5.6l1.6.9 1.6-.9.7-1.9h2.6l.7 1.9 1.6.9 1.6-.9 1.9 1.9-.9 1.6.9 1.6v2.4Z"/>'),
  lock: S('<rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>'),
  face: S('<path d="M4 8.5V6a2 2 0 0 1 2-2h2.5M15.5 4H18a2 2 0 0 1 2 2v2.5M20 15.5V18a2 2 0 0 1-2 2h-2.5M8.5 20H6a2 2 0 0 1-2-2v-2.5"/><path d="M9 10v1.5M15 10v1.5M9.5 15.5a3.5 3.5 0 0 0 5 0"/>')
};
const CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></svg>';

/* -------------------------------------------------------------- seed */
const SEED = {
  meta: { lastUpdated:"2026-08-08", startDate:"2025-09-30", schema:2,
          auditSheet:"https://docs.google.com/spreadsheets/d/1FlfPcjJ3L1Mfqerbo4yLc39JvZfPrRwBQhizEXX3wiI/edit" },
  assumptions: {
    splitAle: 50,
    monthly: [
      { key:"octopus", provider:"Octopus Energy",   paidBy:"Ale",   amount:0, payDay:1,  note:"Direct payment by Ale on the 1st. DD £117.80 less the £14.43 target-balance component." },
      { key:"council", provider:"Council Tax",      paidBy:"Ale",   amount:0, payDay:15, note:"Paid on the 15th of each month." },
      { key:"thames",  provider:"Thames Water",     paidBy:"Amira", amount:74.66,  payDay:28, note:"Latest recurring water amount." },
      { key:"virgin",  provider:"Virgin Media",     paidBy:"Amira", amount:29.49,  payDay:12, note:"" }
    ]
  },
  items: [
  ],
  uploads: []
};

/* ------------------------------------------------------------- state */
let state = seedClone(), tab = "overview", billFilter = "all";
let reviewQueue = [], showAll = { bills:false, payments:false };

function seedClone(){ const s = JSON.parse(JSON.stringify(SEED));
  s.deleted = {}; s.assumptionsUpdatedAt = "2026-08-08T00:00:00.000Z";
  s.items.forEach(i => i.updatedAt = i.updatedAt || "2026-08-08T00:00:00.000Z"); return s; }
function normalise(p){
  if(!p || !Array.isArray(p.items)) return seedClone();
  p.uploads = p.uploads||[]; p.deleted = p.deleted||{};
  p.assumptions = p.assumptions||seedClone().assumptions;
  p.assumptionsUpdatedAt = p.assumptionsUpdatedAt||"2026-08-08T00:00:00.000Z";
  p.items.forEach(i => i.updatedAt = i.updatedAt || "2026-08-08T00:00:00.000Z");
  p.meta = Object.assign(seedClone().meta, p.meta||{}); return p;
}

/* Merge two ledgers: newest edit per entry wins, deletions are honoured both ways. */
function mergeState(local, remote){
  local = normalise(local); remote = normalise(remote);
  const deleted = Object.assign({}, remote.deleted, local.deleted);
  for(const id in remote.deleted){
    if(!local.deleted[id] || remote.deleted[id] > local.deleted[id]) deleted[id] = remote.deleted[id];
  }
  const byId = new Map();
  const put = it => {
    const cur = byId.get(it.id);
    if(!cur || (it.updatedAt||"") >= (cur.updatedAt||"")) byId.set(it.id, it);
  };
  remote.items.forEach(put); local.items.forEach(put);
  const items = [...byId.values()].filter(it => !(deleted[it.id] && deleted[it.id] >= (it.updatedAt||"")));

  const ups = new Map();
  (remote.uploads||[]).forEach(u=>ups.set(u.id,u)); (local.uploads||[]).forEach(u=>ups.set(u.id,u));

  const newerAssume = (local.assumptionsUpdatedAt||"") >= (remote.assumptionsUpdatedAt||"") ? local : remote;
  return {
    meta: Object.assign({}, remote.meta, local.meta,
      { lastUpdated: (local.meta.lastUpdated||"") > (remote.meta.lastUpdated||"") ? local.meta.lastUpdated : remote.meta.lastUpdated }),
    assumptions: newerAssume.assumptions,
    assumptionsUpdatedAt: newerAssume.assumptionsUpdatedAt,
    items, uploads:[...ups.values()], deleted
  };
}

/* ------------------------------------------------------ lock & crypto */
const AUTH_KEY="hh_auth_v1", DATA_KEY="hh_data_v1", BIO_KEY="hh_bio_v1";
const SUB = (typeof crypto!=="undefined" && crypto.subtle) ? crypto.subtle : null;
const ITER = 210000;
let CK = null;            // active data key
let gateNext = null;      // continuation for the "who is using" step
let lastHidden = 0;

const b64 = b => btoa(String.fromCharCode.apply(null, new Uint8Array(b)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
function readAuth(){ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||"null"); }catch(e){ return null; } }
function writeAuth(a){ localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }

/* fallback for views where WebCrypto is unavailable — gate only, no encryption */
function weakHash(pass, salt){
  let h = 0x811c9dc5;
  const s = salt + "|" + pass;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  let out = h.toString(16);
  for(let r=0;r<5000;r++){ for(let i=0;i<out.length;i++){ h ^= out.charCodeAt(i); h = Math.imul(h,0x01000193)>>>0; } out = h.toString(16); }
  return out;
}
async function deriveKey(pass, salt){
  const base = await SUB.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return SUB.deriveKey({name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256"}, base,
    {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
}
async function encJSON(key, obj){
  const iv = rand(12);
  const ct = await SUB.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { iv:b64(iv), ct:b64(ct) };
}
async function decJSON(key, o){
  const pt = await SUB.decrypt({name:"AES-GCM", iv:unb64(o.iv)}, key, unb64(o.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function persist(){
  try{
    if(SUB && CK) localStorage.setItem(DATA_KEY, JSON.stringify(await encJSON(CK, state)));
    else localStorage.setItem(DATA_KEY, JSON.stringify({plain:state}));
  }catch(e){}
}
function save(touch){ if(touch!==false) state.meta.lastUpdated = todayISO(); persist(); queueSync(); }
async function readData(){
  const raw = localStorage.getItem(DATA_KEY);
  if(!raw){                                     // first run after setting a passcode
    const legacy = localStorage.getItem(STORE_KEY);
    let seed = seedClone();
    if(legacy){ try{ seed = normalise(JSON.parse(legacy)); }catch(e){} }
    state = seed; await persist(); localStorage.removeItem(STORE_KEY); return;
  }
  const o = JSON.parse(raw);
  state = normalise(o.plain ? o.plain : await decJSON(CK, o));
}

/* Face ID / Touch ID */
async function bioAvailable(){
  try{ return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
  catch(e){ return false; }
}
async function bioRegister(){
  const c = await navigator.credentials.create({ publicKey:{
    challenge: rand(32), rp:{ name:"Household" },
    user:{ id: rand(16), name:"household", displayName:"Household" },
    pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
    authenticatorSelection:{ authenticatorAttachment:"platform", userVerification:"required", residentKey:"preferred" },
    attestation:"none", timeout:60000 }});
  return b64(c.rawId);
}
async function bioVerify(credId){
  await navigator.credentials.get({ publicKey:{
    challenge: rand(32), allowCredentials:[{ type:"public-key", id: unb64(credId) }],
    userVerification:"required", timeout:60000 }});
  return true;
}
async function bioEnable(){
  const a = readAuth(); if(!a) return false;
  const credId = await bioRegister();
  if(SUB && CK) localStorage.setItem(BIO_KEY, b64(await SUB.exportKey("raw", CK)));
  a.credId = credId; writeAuth(a); return true;
}
function bioDisable(){ const a = readAuth(); if(a){ delete a.credId; writeAuth(a); } localStorage.removeItem(BIO_KEY); }

/* ---------------------------------------------------- who is using */
const ME_KEY = "hh_me_v1";
function me(){ return localStorage.getItem(ME_KEY) || ""; }
function setMe(name){ localStorage.setItem(ME_KEY, name); }

/* ------------------------------------------------------ shared sync */
/* The repo only ever receives ciphertext. Both phones derive the same key
   from the same passcode using the salt stored alongside it.            */
const SYNC_KEY = "hh_sync_v1";
let syncSha = null, syncTimer = null, syncBusy = false, syncMsg = "";

function syncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY)||"null"); }catch(e){ return null; } }
function setSyncCfg(c){ if(c) localStorage.setItem(SYNC_KEY, JSON.stringify(c)); else localStorage.removeItem(SYNC_KEY); }

function ghUrl(c){ return `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.path||"ledger.json"}`; }
async function ghGet(c){
  const r = await fetch(ghUrl(c)+"?ref="+encodeURIComponent(c.branch||"main"), {
    headers:{ Authorization:"Bearer "+c.token, Accept:"application/vnd.github+json" }, cache:"no-store" });
  if(r.status===404) return null;
  if(!r.ok) throw new Error("GitHub said "+r.status);
  const j = await r.json();
  syncSha = j.sha;
  return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))));
}
async function ghPut(c, obj, sha){
  const body = { message:"Household ledger "+nowISO(), branch:c.branch||"main",
    content: btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2)))) };
  if(sha) body.sha = sha;
  const r = await fetch(ghUrl(c), { method:"PUT",
    headers:{ Authorization:"Bearer "+c.token, Accept:"application/vnd.github+json", "Content-Type":"application/json" },
    body: JSON.stringify(body) });
  if(r.status===409 || r.status===422) return "conflict";
  if(!r.ok) throw new Error("GitHub said "+r.status);
  syncSha = (await r.json()).content.sha;
  return "ok";
}

/* pull remote, merge into local, then push the merged result back */
async function syncNow(opts){
  const c = syncCfg(); if(!c || !CK) return false;
  if(syncBusy) return false;
  syncBusy = true; syncMsg = "Syncing…";
  try{
    const remote = await ghGet(c);
    if(remote && remote.data){
      let rs = null;
      try{ rs = await decJSON(CK, remote.data); }
      catch(e){ syncMsg = "The shared ledger uses a different passcode."; syncBusy=false; return false; }
      state = mergeState(state, rs);
    }
    const payload = { v:1, updatedAt: nowISO(),
      auth: (()=>{ const a = readAuth(); return { salt:a.salt, iter:a.iter||ITER, check:a.check }; })(),
      data: await encJSON(CK, state) };
    let res = await ghPut(c, payload, syncSha);
    if(res==="conflict"){ await ghGet(c); res = await ghPut(c, payload, syncSha); }
    await persist();
    c.lastSync = nowISO(); setSyncCfg(c);
    syncMsg = "Synced "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    syncBusy = false;
    if(!opts||opts.render!==false) render();
    return true;
  }catch(e){
    syncBusy = false; syncMsg = "Sync failed — "+e.message;
    if(!opts||opts.render!==false) render();
    return false;
  }
}
function queueSync(){
  if(!syncCfg()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>syncNow({render:false}), 1500);
}

/* pull only — used before a passcode exists on a second device */
async function syncAdopt(c){
  const remote = await ghGet(c);
  if(!remote || !remote.auth) throw new Error("No shared ledger found in that repo yet.");
  writeAuth({ salt:remote.auth.salt, iter:remote.auth.iter||ITER, check:remote.auth.check });
  setSyncCfg(c);
  return true;
}

/* ------------------------------------------------------------- gate */
function gateHTML(body){ return `<div class="gicon">${ICON.home}</div><h2>Household</h2>${body}`; }
function showGate(html){
  document.getElementById("gateIn").innerHTML = html;
  document.getElementById("gate").classList.add("on");
  document.body.classList.add("locked");
}
function hideGate(){
  document.getElementById("gate").classList.remove("on");
  document.body.classList.remove("locked");
}
function gateErr(msg){ const e = document.getElementById("gErr"); if(e) e.textContent = msg||""; }

function setupScreen(){
  showGate(gateHTML(`
    <p class="gsub">Choose a passcode. You will need it every time this opens${SUB?", and it encrypts everything stored on this device":""}.</p>
    <input type="password" id="g1" placeholder="New passcode" autocomplete="new-password">
    <input type="password" id="g2" placeholder="Repeat passcode" autocomplete="new-password">
    <div class="err" id="gErr"></div>
    <button class="gbtn" id="gSet">Set passcode</button>
    <button class="gbtn alt" id="gJoin">Join a shared ledger</button>
    <p class="gnote">${SUB
      ? "Keep it somewhere safe — without it the saved data cannot be opened. Export a backup from Settings if you want a copy."
      : "This view cannot encrypt data, so the passcode locks the screen only."}</p>`));
  document.getElementById("gSet").onclick = async () => {
    const a = document.getElementById("g1").value, b = document.getElementById("g2").value;
    if(a.length < 4) return gateErr("Use at least 4 characters.");
    if(a !== b) return gateErr("The two passcodes do not match.");
    gateErr("");
    const saltB = rand(16), salt = b64(saltB);
    if(SUB){
      CK = await deriveKey(a, saltB);
      writeAuth({ salt, iter:ITER, check: await encJSON(CK, {ok:true}) });
    } else {
      writeAuth({ salt, weak: weakHash(a, salt) });
    }
    await readData();
    toast("Passcode set.");
    afterUnlock();
  };
  document.getElementById("gJoin").onclick = () => {
    hideGate();
    syncSheet(() => { toast("Now enter the shared passcode."); lockScreen(); });
  };
}

/* who is using this device */
function whoScreen(next){

    <p class="gsub">Who is using this phone? It sets the defaults and records who added what.</p>
    <div class="tiles" style="margin-top:4px">

}

/* offer Face ID / Touch ID */
async function bioScreen(next){
  const a = readAuth()||{};
  if(a.credId || !(await bioAvailable()) || localStorage.getItem("hh_bio_asked")==="1") return next();
  showGate(gateHTML(`
    <p class="gsub">Open Household with Face ID or Touch ID instead of typing your passcode each time.</p>
    <div class="gicon" style="background:var(--card);color:var(--blue);margin-top:4px">${ICON.face}</div>
    <button class="gbtn" id="bYes">Turn on Face ID or Touch ID</button>
    <button class="gbtn alt" id="bNo">Not now</button>
    <p class="gnote">Your passcode still works, and this keeps a copy of the key on this device so it can open without typing.</p>`));
  document.getElementById("bNo").onclick = () => { localStorage.setItem("hh_bio_asked","1"); next(); };
  document.getElementById("bYes").onclick = async () => {

}

function enterApp(){
  hideGate(); render();
  if(syncCfg()) syncNow();
}
function afterUnlock(){
  const go = () => bioScreen(enterApp);
  if(!me()) whoScreen(go); else go();
}

async function lockScreen(){
  const a = readAuth();
  const canBio = a.credId && await bioAvailable();
  showGate(gateHTML(`
    <p class="gsub">Enter your passcode to continue.</p>
    <input type="password" id="g1" placeholder="Passcode" autocomplete="current-password">
    <div class="err" id="gErr"></div>
    <button class="gbtn" id="gGo">Unlock</button>
    ${canBio?`<button class="gbtn alt" id="gBio">Unlock with Face ID or Touch ID</button>`:""}`));
  const input = document.getElementById("g1");
  input.onkeydown = e => { if(e.key==="Enter") document.getElementById("gGo").click(); };
  document.getElementById("gGo").onclick = async () => {
    const pass = input.value; gateErr("");
    try{
      if(SUB){
        CK = await deriveKey(pass, unb64(a.salt));
        await decJSON(CK, a.check);            // throws if wrong
      } else if(weakHash(pass, a.salt) !== a.weak){ throw new Error("bad"); }
      await readData(); afterUnlock();
    }catch(e){ CK = null; input.value=""; gateErr("That passcode is not right."); }
  };
  if(canBio) document.getElementById("gBio").onclick = async () => {
    gateErr("");
    try{
      await bioVerify(a.credId);
      const raw = localStorage.getItem(BIO_KEY);
      if(SUB && raw) CK = await SUB.importKey("raw", unb64(raw), {name:"AES-GCM"}, true, ["encrypt","decrypt"]);
      await readData(); afterUnlock();
    }catch(e){ gateErr("Face ID or Touch ID did not work. Use your passcode."); }
  };
  setTimeout(()=>{ try{ input.focus(); }catch(e){} }, 350);
}

function lockNow(){ CK = null; closeSheet(); lockScreen(); }

function boot(){
  if(readAuth()) lockScreen();
  else setupScreen();
}
document.addEventListener("visibilitychange", () => {
  if(document.hidden) lastHidden = Date.now();
  else if(lastHidden && Date.now()-lastHidden > 5*60*1000 && readAuth() && !document.getElementById("gate").classList.contains("on")) lockNow();
  else if(!document.hidden && CK && syncCfg()) syncNow({render:true});
});
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function uid(p){ return (p||"i")+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7); }

/* ----------------------------------------------------------- helpers */
const round2 = n => Math.round((Number(n)||0)*100)/100;
const gbp = n => "£"+Math.abs(round2(n)).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
const gbpS = n => (n<0?"−":"")+gbp(n);
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso+"T00:00:00");
  return isNaN(d)?iso:d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }
function fmtShort(iso){ if(!iso) return "—"; const d=new Date(iso+"T00:00:00");
  return isNaN(d)?iso:d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"2-digit"}); }
function ord(n){ if(!n) return ""; const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const STATUS_LABEL = { counted:"Counted", pending_review:"Pending", excluded:"Not included", duplicate:"Duplicate", needs_confirmation:"To confirm" };
const TYPE_LABEL = { provider_bill:"Provider bill", housemate_payment:"Payment between us", pending:"Pending item", excluded:"Not included" };
const PROV = {
  "Octopus Energy":{ic:"bolt",t:"t-orange"}, "Council Tax":{ic:"bank",t:"t-blue"},
  "Thames Water":{ic:"drop",t:"t-teal"}, "Virgin Media":{ic:"wifi",t:"t-purple"},
  "Rent — Foxtons":{ic:"home",t:"t-grey"}, "House order":{ic:"box",t:"t-grey"}
};
function art(it){
  if(it.type==="housemate_payment") return {ic:"send",t:"t-teal"};
  const p = PROV[it.provider];
  if(p) return it.status==="counted" ? p : {ic:p.ic,t:"t-grey"};
  return {ic:"doc",t:"t-grey"};
}

/* ------------------------------------------------------ calculations */
function calc(){
  const c = state.items.filter(i=>i.status==="counted");
  const aleBills   = c.filter(i=>i.type==="provider_bill"&&i.paidBy==="Ale").reduce((s,i)=>s+Number(i.amount||0),0);
  const amiraBills = c.filter(i=>i.type==="provider_bill"&&i.paidBy==="Amira").reduce((s,i)=>s+Number(i.amount||0),0);
  const payments   = c.filter(i=>i.type==="housemate_payment").reduce((s,i)=>s+(i.paidBy==="Ale"?-Number(i.amount||0):Number(i.amount||0)),0);
  const share = (state.assumptions.splitAle||50)/100;
  const expected = aleBills*share - amiraBills*share;
  return { aleBills:round2(aleBills), amiraBills:round2(amiraBills), payments:round2(payments),
    diff:round2(aleBills-amiraBills), expected:round2(expected), balance:round2(expected-payments),
    countedCount:c.length,
    pendingCount:state.items.filter(i=>i.status==="pending_review"||i.status==="needs_confirmation").length,
    excludedCount:state.items.filter(i=>i.status==="excluded").length,
    dupCount:state.items.filter(i=>i.status==="duplicate").length,
    payCount:c.filter(i=>i.type==="housemate_payment").length };
}
function monthly(){
  const m = state.assumptions.monthly, share=(state.assumptions.splitAle||50)/100;
  const a = m.filter(x=>x.paidBy==="Ale").reduce((s,x)=>s+Number(x.amount||0),0);
  const b = m.filter(x=>x.paidBy==="Amira").reduce((s,x)=>s+Number(x.amount||0),0);
  return { ale:round2(a), amira:round2(b), net:round2((a-b)*share) };
}
function words(b){
  if(Math.abs(b)<0.005) return {dir:"Settled up",tone:"var(--label)"};
  return b>0 ? {dir:"Amira owes Ale",tone:"var(--label)"} : {dir:"Ale owes Amira",tone:"var(--label)"};
}
</script>

<script>

const PROVIDER_RULES = [
  { provider:"Octopus Energy", paidBy:"Ale",   keys:["octopus","electricity","gas","energy bill"] },
  { provider:"Council Tax",    paidBy:"Ale",   keys:["council tax","counciltax","rbkc","kensington","chelsea","council"] },
  { provider:"Thames Water",   paidBy:"Amira", keys:["thames","water bill","water"] },

  { provider:"Amira → Ale",    paidBy:"Amira", keys:["revolut","rayner","amira","transfer","sent you"] }
];
function guessProvider(h){ for(const r of PROVIDER_RULES) for(const k of r.keys) if(h.includes(k)) return r; return null; }
function parseAmount(t){
  if(!t) return null;
  const lab = t.match(/(?:total|amount|paid|due|balance|payment)[^0-9£]{0,20}£?\s?(\d{1,3}(?:,\d{3})*\.\d{2})/i);
  if(lab) return Number(lab[1].replace(/,/g,""));
  const all = [...t.matchAll(/£\s?(\d{1,3}(?:,\d{3})*(?:\.\d{2})?)/g)].map(m=>Number(m[1].replace(/,/g,"")));
  if(all.length) return all.sort((a,b)=>b-a)[0];
  const bare = t.match(/\b(\d{1,4}\.\d{2})\b/); return bare?Number(bare[1]):null;
}
const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function parseDates(t){
  if(!t) return [];
  const out=[];
  [...t.matchAll(/\b(20\d{2})-(\d{2})-(\d{2})\b/g)].forEach(m=>out.push(`${m[1]}-${m[2]}-${m[3]}`));
  [...t.matchAll(/\b(\d{1,2})[\/.](\d{1,2})[\/.](20\d{2}|\d{2})\b/g)].forEach(m=>{
    const y=m[3].length===2?"20"+m[3]:m[3];
    out.push(`${y}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`); });
  [...t.matchAll(/\b(\d{1,2})\s*(?:st|nd|rd|th)?\s+([A-Za-z]{3,9})\.?\s*(20\d{2})?\b/g)].forEach(m=>{
    const mo = MONTHS[m[2].slice(0,4).toLowerCase()] ?? MONTHS[m[2].slice(0,3).toLowerCase()];
    if(mo===undefined) return;
    const y = m[3]||String(new Date().getFullYear());
    out.push(`${y}-${String(mo+1).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`); });
  return [...new Set(out)].filter(d=>!isNaN(new Date(d+"T00:00:00")));
}
function guessKind(h){
  if(/\b(sent|received|transfer|revolut)\b/.test(h)) return "payment";
  if(/\breceipt\b/.test(h)) return "receipt";
  if(/\bstatement\b/.test(h)) return "statement";
  if(/\b(bill|invoice|charges)\b/.test(h)) return "bill";
  return "unknown";
}
function guessPaid(h){
  if(/\b(paid|payment received|completed|sent)\b/.test(h)) return "paid";
  if(/\b(due|upcoming|will be taken|pay by)\b/.test(h)) return "due";
  return "unclear";
}
async function hashFile(f){
  try{ const b=await f.arrayBuffer(); const d=await crypto.subtle.digest("SHA-256",b);
    return [...new Uint8Array(d)].slice(0,8).map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){ return f.name+"-"+f.size; }
}
async function buildCandidate(file, text){
  const hay = (file.name+" "+(text||"")).toLowerCase();
  const rule = guessProvider(hay);
  const amount = parseAmount(text||"") ?? parseAmount(file.name);
  const dates = parseDates(text||"");
  const isPay = rule && rule.provider==="Amira → Ale";
  let conf = 0; if(rule) conf+=40; if(amount) conf+=30; if(dates.length) conf+=25; if((text||"").length>40) conf+=5;
  const c = {
    cid:uid("c"), fileName:file.name, fileHash:await hashFile(file),
    docType: rule ? (isPay?"payment screenshot":rule.provider+" "+guessKind(hay)) : "Unknown",
    kind:guessKind(hay), paidStatus:guessPaid(hay),
    provider: rule?rule.provider:"", paidBy: rule?rule.paidBy:"",
    type: isPay?"housemate_payment":"provider_bill",
    amount: amount||0, date: dates[0]||"",
    periodStart: dates.length>1?dates.slice().sort()[0]:"",
    periodEnd: dates.length>1?dates.slice().sort()[dates.length-1]:"",
    reference: ((text||"").match(/\b(ref(?:erence)?|acct|account)[:\s#]+([A-Za-z0-9-]{4,})/i)||[])[2]||"",
    confidence: conf
  };
  c.checks = runChecks(c);
  return c;
}
function runChecks(c){
  const out = { verdict:"new", reasons:[], matches:[], covered:null };
  const same = (state.uploads||[]).find(u=>u.fileHash && u.fileHash===c.fileHash);
  if(same){ out.verdict="duplicate"; out.reasons.push("This exact file was uploaded on "+fmtDate(same.at)+"."); }
  const matches = state.items.filter(i=>{
    if(!c.amount||!i.amount||!c.provider||i.provider!==c.provider) return false;
    if(Math.abs(Number(i.amount)-Number(c.amount))>0.02) return false;
    if(!c.date||!i.date) return true;
    const dd = Math.abs(new Date(c.date)-new Date(i.date))/86400000;
    const overlap = c.periodStart&&i.periodStart&&!(c.periodEnd<i.periodStart||c.periodStart>i.periodEnd);
    return dd<=5||overlap;
  });
  if(matches.length){ out.matches=matches; if(out.verdict!=="duplicate") out.verdict="possible_duplicate";
    out.reasons.push("An entry already exists with the same provider, a near-identical amount and an overlapping date."); }
  if(c.provider&&c.date&&c.type==="provider_bill"){
    const agg = state.items.find(i=>i.opening&&i.provider===c.provider&&i.coveredThrough&&c.date<=i.coveredThrough);
    if(agg){ out.covered=agg; if(out.verdict==="new") out.verdict="already_covered";
      out.reasons.push("This date sits inside the "+agg.provider+" total, which already covers up to "+fmtDate(agg.coveredThrough)+"."); }
  }
  if(out.verdict==="new" && c.confidence<60){ out.verdict="needs_review"; out.reasons.push("Not enough was read from the file to be confident."); }
  if(!c.amount && out.verdict!=="duplicate"){ out.verdict="needs_review"; if(!out.reasons.length) out.reasons.push("No amount could be read."); }
  return out;
}

function wireUpload(){
  const drop=document.getElementById("drop"), input=document.getElementById("fileInput")||(()=>{
    const i=document.createElement("input"); i.type="file"; i.multiple=true; i.id="fileInput"; i.hidden=true;
    i.accept="image/*,application/pdf,.pdf,.png,.jpg,.jpeg,.heic,.txt"; document.body.appendChild(i); return i;})();
  if(!drop) return;
  input.onchange = e => handleFiles(e.target.files);
  drop.onclick = () => input.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); handleFiles(e.dataTransfer.files); };
}
async function handleFiles(files){
  if(!files||!files.length) return;
  const text = (document.getElementById("pasteText")||{}).value||"";
  const blocks = text.split(/\n\s*\n/).filter(b=>b.trim().length);
  const list = [...files];
  for(let i=0;i<list.length;i++){
    const t = (list.length>1 && blocks.length===list.length) ? blocks[i] : text;
    reviewQueue.push(await buildCandidate(list[i], t));
  }
  if(list.length===1 && blocks.length>1){
    reviewQueue.pop();
    for(const b of blocks) reviewQueue.push(await buildCandidate(list[0], b));
    toast(`Found ${blocks.length} records — review each one.`);
  }
  render();
  toast(`${reviewQueue.length} item${reviewQueue.length>1?"s":""} to review. Nothing added yet.`);
}
function logUpload(c,outcome,label){
  state.uploads = state.uploads||[];
  state.uploads.push({id:uid("u"),at:todayISO(),fileName:c.fileName,fileHash:c.fileHash,provider:c.provider,amount:c.amount,outcome,outcomeLabel:label});
}
function commitCandidate(cid,mode){
  const c = reviewQueue.find(x=>x.cid===cid); if(!c) return;
  if(mode==="ignore"){
    logUpload(c,"ignored","Ignored");
    reviewQueue = reviewQueue.filter(x=>x.cid!==cid); save(); render();
    toast("Nothing added. 1 item ignored."); return;
  }
  if(mode==="mark-dup"){
    state.items.push({id:uid("d"),date:c.date||todayISO(),type:c.type,provider:c.provider||c.fileName,
      paidBy:c.paidBy||"—",amount:c.amount||0,status:"duplicate",
      notes:"Marked duplicate on upload. Kept as supporting evidence.",source:c.fileName+" · "+c.fileHash,updatedAt:nowISO(),by:me()||""});
    if(c.checks.matches.length){ const m=c.checks.matches[0];
      m.source=(m.source||"")+" · also evidenced by "+c.fileName; m.updatedAt=nowISO(); }
    logUpload(c,"duplicate","Marked duplicate");
    reviewQueue = reviewQueue.filter(x=>x.cid!==cid); save(); render();
    toast("Nothing added. 1 duplicate recorded."); return;
  }
  const counted = mode==="add-counted";
  state.items.push({
    id:uid(c.type==="housemate_payment"?"p":"b"), date:c.date||todayISO(),
    type: counted?c.type:"pending", provider:c.provider||c.fileName, paidBy:c.paidBy||"—",
    amount:round2(c.amount), status:counted?"counted":"pending_review",
    periodStart:c.periodStart||"", periodEnd:c.periodEnd||"",
    notes:(counted?"Added from upload.":"Added from upload, held for review.")+(c.reference?" Ref "+c.reference+".":""),
    source:c.fileName+" · "+c.fileHash, updatedAt:nowISO(), by:me()||""
  });
  logUpload(c,counted?"added":"pending",counted?"Added as counted":"Added as pending");
  reviewQueue = reviewQueue.filter(x=>x.cid!==cid); save(); render();
  toast(counted ? `Added 1 ${c.type==="housemate_payment"?"payment":"bill"}. Balance updated.` : "Added 1 item to pending. Balance unchanged.");
}

      <div class="f"><label>Date</label><input type="date" id="f-date" value="${esc(it.date||o.date||todayISO())}"></div>
      <div class="f"><label>Amount</label><input type="number" step="0.01" inputmode="decimal" id="f-amount" value="${it.amount||o.amount||""}"></div>
    </div>
    <div class="two">
      <div class="f"><label>Paid by</label><select id="f-paidby">${["Ale","Amira","Both","—"].map(p=>
        `<option ${((it.paidBy||o.paidBy)===p)?"selected":""}>${p}</option>`).join("")}</select></div>
      <div class="f"><label>Status</label><select id="f-status">${Object.keys(STATUS_LABEL).map(k=>
        `<option value="${k}" ${((it.status||o.status||"counted")===k)?"selected":""}>${STATUS_LABEL[k]}</option>`).join("")}</select></div>
    </div>
    <div class="two">
      <div class="f"><label>Period from</label><input type="date" id="f-ps" value="${esc(it.periodStart||o.periodStart||"")}"></div>
      <div class="f"><label>Period to</label><input type="date" id="f-pe" value="${esc(it.periodEnd||o.periodEnd||"")}"></div>
    </div>
    <div class="f"><label>Notes</label><textarea id="f-notes">${esc(it.notes||o.notes||"")}</textarea></div>
    <div class="f"><label>Evidence</label><input id="f-source" value="${esc(it.source||o.source||"")}" placeholder="Revolut screenshot, 6 Aug"></div>
    <button class="btn pri" id="f-save" data-id="${it.id||""}" data-cid="${o.cid||""}">${isNew?"Add to tracker":"Save changes"}</button>
    <button class="btn qui" data-close>Cancel</button>`);

  if(isNew){
    const old = document.getElementById("formFile"); if(old) old.remove();
    const fi = document.createElement("input");
    fi.type="file"; fi.id="formFile"; fi.accept="image/*,application/pdf,.pdf,.png,.jpg,.jpeg,.heic,.txt"; fi.hidden=true;
    document.body.appendChild(fi);
    fi.onchange = async ev => {
      if(!ev.target.files.length) return;
      const txt = (document.getElementById("attText")||{}).value||"";
      attached = await buildCandidate(ev.target.files[0], txt);
      document.getElementById("attInfo").style.display = "";
      fillFromCandidate(attached);
    };
    document.getElementById("attachBtn").onclick = () => fi.click();
    document.getElementById("readTextBtn").onclick = async () => {
      const txt = (document.getElementById("attText")||{}).value||"";
      if(!txt.trim()){ toast("Paste some text first."); return; }
      attached = await buildCandidate(new File([txt], attached?attached.fileName:"pasted-text.txt", {type:"text/plain"}), txt);
      document.getElementById("attInfo").style.display = "";
      fillFromCandidate(attached);
    };
  }

  document.getElementById("f-save").onclick = e => {
    const g = id => (document.getElementById(id)||{}).value;
    const provider = (g("f-provider")||"").trim();
    if(!provider){ toast("Add a provider or person first."); return; }
    if(attached && attached.checks.reasons.length && g("f-status")==="counted"){
      if(!confirm("This may already be tracked.\n\n"+attached.checks.reasons.join("\n")+"\n\nAdd it anyway?")) return;
    }
    const patch = { type:g("f-type"), provider, date:g("f-date")||todayISO(), amount:round2(Number(g("f-amount"))||0),
      paidBy:g("f-paidby"), status:g("f-status"), periodStart:g("f-ps")||"", periodEnd:g("f-pe")||"",
      notes:g("f-notes")||"", source:g("f-source")||"", updatedAt:nowISO(), by:me()||"" };
    const id = e.currentTarget.dataset.id, cid = e.currentTarget.dataset.cid;
    if(id){ Object.assign(state.items.find(x=>x.id===id), patch); toast("Updated. Balance recalculated."); }
    else {
      state.items.push(Object.assign({id:uid("m")},patch));
      if(attached) logUpload(attached, patch.status==="counted"?"added":"pending",
        patch.status==="counted"?"Added as counted":"Added as pending");
      toast(patch.status==="counted"?"Added. Balance updated.":"Added to "+STATUS_LABEL[patch.status].toLowerCase()+".");
    }
    if(cid) reviewQueue = reviewQueue.filter(x=>x.cid!==cid);
    attached = null;
    save(); closeSheet(); render();
  };
}

function assumeSheet(idx){
  const a = state.assumptions.monthly[idx];
  openSheet(`<h3>${esc(a.provider)}</h3><p class="lead">Sets the monthly estimate only. It does not change the balance.</p>
    <div class="two">
      <div class="f"><label>Amount a month</label><input type="number" step="0.01" inputmode="decimal" id="a-amt" value="${a.amount}"></div>
      <div class="f"><label>Paid on day</label><input type="number" min="1" max="31" inputmode="numeric" id="a-day" value="${a.payDay||""}"></div>
    </div>
    <div class="f"><label>Paid by</label><select id="a-by">${["Ale","Amira"].map(p=>`<option ${a.paidBy===p?"selected":""}>${p}</option>`).join("")}</select></div>
    <div class="f"><label>Note</label><textarea id="a-note">${esc(a.note||"")}</textarea></div>
    <button class="btn pri" id="a-save" data-idx="${idx}">Save</button>
    <button class="btn qui" data-close>Cancel</button>`);
  document.getElementById("a-save").onclick = () => {
    const g = id => (document.getElementById(id)||{}).value;
    a.amount = round2(Number(g("a-amt"))||0);
    a.payDay = Number(g("a-day"))||null;
    a.paidBy = g("a-by"); a.note = g("a-note")||"";
    state.assumptionsUpdatedAt = nowISO();
    save(); closeSheet(); render(); toast("Saved. Monthly estimate updated.");
  };
}

/* ------------------------------------------------------- sync sheet */
function syncSheet(onDone){
  const c = syncCfg()||{ owner:"", repo:"household-ledger", path:"ledger.json", branch:"main", token:"" };
  openSheet(`<h3>Shared sync</h3>
    <p class="lead">Both phones point at one private GitHub repository. Only encrypted data is sent.</p>
    <div class="f"><label>GitHub username</label><input id="s-owner" value="${esc(c.owner)}" placeholder="your-username" autocapitalize="none" autocorrect="off"></div>
    <div class="f"><label>Repository name</label><input id="s-repo" value="${esc(c.repo)}" placeholder="household-ledger" autocapitalize="none" autocorrect="off"></div>
    <div class="f"><label>Access token</label><input id="s-token" type="password" value="${esc(c.token||"")}" placeholder="github_pat_…" autocapitalize="none" autocorrect="off">
      <div class="h">Fine-grained token with Contents set to Read and write on that one repository.</div></div>
    <div class="two">
      <div class="f"><label>File</label><input id="s-path" value="${esc(c.path||"ledger.json")}" autocapitalize="none"></div>
      <div class="f"><label>Branch</label><input id="s-branch" value="${esc(c.branch||"main")}" autocapitalize="none"></div>
    </div>
    <button class="btn pri" id="s-save">${onDone?"Connect and load":"Save and sync"}</button>
    ${syncCfg()?`<button class="btn des" id="s-off">Disconnect this device</button>`:""}
    <button class="btn qui" data-close>Cancel</button>`);
  const g = id => (document.getElementById(id)||{}).value.trim();
  const off = document.getElementById("s-off");
  if(off) off.onclick = () => { setSyncCfg(null); syncSha=null; syncMsg=""; closeSheet(); render(); toast("Sync turned off on this device."); };
  document.getElementById("s-save").onclick = async () => {
    const cfg = { owner:g("s-owner"), repo:g("s-repo"), token:g("s-token"), path:g("s-path")||"ledger.json", branch:g("s-branch")||"main" };
    if(!cfg.owner||!cfg.repo||!cfg.token){ toast("Fill in username, repository and token."); return; }
    toast("Checking the repository…");
    try{
      if(onDone){ await syncAdopt(cfg); closeSheet(); onDone(); return; }
      setSyncCfg(cfg); syncSha = null;
      const ok = await syncNow({render:false});
      closeSheet(); render();
      toast(ok ? "Sync is on." : (syncMsg||"Could not reach the repository."));
    }catch(e){ toast(e.message||"Could not reach the repository."); }
  };
}

/* --------------------------------------------------------- security */
async function securityAction(what){
  if(what==="lock") return lockNow();
  if(what==="bio"){
    const a = readAuth()||{};
    if(a.credId){
      if(!confirm("Turn this off? You will need your passcode each time.")) return;
      bioDisable(); render(); toast("Turned off."); return;
    }
    if(!(await bioAvailable())) return toast("Not available here — this needs an https address.");
    try{ await bioEnable(); render(); toast("Turned on."); }
    catch(e){ toast("That could not be set up here."); }
    return;
  }
  if(what==="change"){
    openSheet(`<h3>Change passcode</h3><p class="lead">You will need the current one first.</p>
      <div class="f"><label>Current passcode</label><input type="password" id="c0" autocomplete="current-password"></div>
      <div class="f"><label>New passcode</label><input type="password" id="c1" autocomplete="new-password"></div>
      <div class="f"><label>Repeat new passcode</label><input type="password" id="c2" autocomplete="new-password"></div>
      <button class="btn pri" id="cSave">Change passcode</button>
      <button class="btn qui" data-close>Cancel</button>`);
    document.getElementById("cSave").onclick = async () => {
      const g = id => document.getElementById(id).value;
      const a = readAuth();
      if(g("c1").length < 4) return toast("Use at least 4 characters.");
      if(g("c1") !== g("c2")) return toast("The new passcodes do not match.");
      try{
        if(SUB){
          const old = await deriveKey(g("c0"), unb64(a.salt));
          await decJSON(old, a.check);
          const saltB = rand(16);
          CK = await deriveKey(g("c1"), saltB);
          writeAuth({ salt:b64(saltB), iter:ITER, check: await encJSON(CK, {ok:true}), credId:a.credId });
          await persist();
          if(a.credId) localStorage.setItem(BIO_KEY, b64(await SUB.exportKey("raw", CK)));
        } else {
          if(weakHash(g("c0"), a.salt) !== a.weak) throw new Error("bad");
          const salt = b64(rand(16));
          writeAuth({ salt, weak: weakHash(g("c1"), salt), credId:a.credId });
        }
        closeSheet(); toast("Passcode changed.");
      }catch(e){ toast("The current passcode is not right."); }
    };
  }
}

/* ------------------------------------------------------------ events */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-explain],[data-item],[data-prov],[data-filter],[data-add],[data-pick],[data-close],[data-edit],[data-status],[data-del],[data-act],[data-showall],[data-assume],[data-sec],[data-sync],[data-who],#whoBtn,#exportBtn,#importBtn,#resetBtn,#sheetBtn");
  if(!t) return;
  const d = t.dataset;
  if(d.who){                                   // person chosen, on the gate or from Settings
    setMe(d.who);
    if(gateNext){ const n = gateNext; gateNext = null; n(); }
    else { closeSheet(); render(); toast("Now using this as "+d.who+"."); }
    return;
  }
  if(t.id==="whoBtn" || d.sec==="who"){
    openSheet(`<h3>Who is using this?</h3><p class="lead">Sets the defaults and records who added what.</p>
      <div class="tiles">${tile("home","s-blue","Ale",'data-who="Ale"')}${tile("home","s-teal","Amira",'data-who="Amira"')}</div>
      <button class="btn qui" style="margin-top:18px" data-close>Cancel</button>`);
    return;
  }
  if(d.sec){ securityAction(d.sec); return; }
  if(d.sync){
    if(d.sync==="setup") syncSheet();
    else { syncMsg="Syncing…"; render(); syncNow(); }
    return;
  }
  if(t.id==="exportBtn"){
    const b = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download="household-bills-"+todayISO()+".json"; a.click(); URL.revokeObjectURL(a.href);
    toast("Backup exported."); return;
  }
  if(t.id==="importBtn"){ document.getElementById("importFile").click(); return; }
  if(t.id==="sheetBtn"){ window.open(state.meta.auditSheet,"_blank","noopener"); return; }
  if(t.id==="resetBtn"){
    if(!confirm("Reset everything back to the 8 August 2026 baseline?")) return;
    state = seedClone(); reviewQueue=[]; save(false); render(); toast("Reset to the baseline."); return;
  }
  if(d.showall!==undefined && t.hasAttribute("data-showall")){ showAll[d.showall]=!showAll[d.showall]; render(); return; }
  if(d.tab){ tab=d.tab; render(); return; }
  if(d.filter){ billFilter=d.filter; render(); return; }
  if(d.explain){ explainSheet(d.explain); return; }
  if(d.prov){ provSheet(d.prov); return; }
  if(d.assume!==undefined && t.hasAttribute("data-assume")){ assumeSheet(Number(d.assume)); return; }
  if(d.item){ itemSheet(d.item); return; }
  if(t.hasAttribute("data-add")){ pickerSheet(d.add); return; }
  if(t.hasAttribute("data-pick")){
    const i = d.pick.indexOf(":"), kind = d.pick.slice(0,i), provider = d.pick.slice(i+1);
    if(kind==="pay"){
      formSheet({ type:"housemate_payment", status:"counted",
        provider: provider==="Amira" ? "Amira → Ale" : "Ale → Amira", paidBy: provider });
      return;
    }
    const cat = CATS.find(c=>c.provider===provider);
    const def = { provider_bill:{status:"counted"}, pending:{status:"pending_review"}, excluded:{status:"excluded"} };
    formSheet(Object.assign({ type:kind, provider, paidBy: cat?cat.paidBy:"—" }, def[kind]||{}));
    return;
  }
  if(t.hasAttribute("data-close")){ closeSheet(); return; }
  if(d.edit){ formSheet({item:state.items.find(x=>x.id===d.edit)}); return; }
  if(d.status&&d.sid){
    const it = state.items.find(x=>x.id===d.sid); it.status=d.status; it.updatedAt=nowISO();
    save(); closeSheet(); render();
    toast(d.status==="counted"?"Counted. Balance updated.":"Moved to "+STATUS_LABEL[d.status].toLowerCase()+".");
    return;
  }
  if(d.del){
    if(!confirm("Delete this entry? The balance will recalculate.")) return;
    state.items = state.items.filter(x=>x.id!==d.del);
    state.deleted = state.deleted||{}; state.deleted[d.del] = nowISO();
    save(); closeSheet(); render(); toast("Deleted. Balance updated.");
    return;
  }
  if(d.act&&d.cid){
    if(d.act==="edit"){
      const c = reviewQueue.find(x=>x.cid===d.cid);
      formSheet({type:c.type,provider:c.provider,date:c.date,amount:c.amount,paidBy:c.paidBy,
        periodStart:c.periodStart,periodEnd:c.periodEnd,status:"counted",
        notes:"Added from upload after manual correction.",source:c.fileName+" · "+c.fileHash,cid:c.cid});
      return;
    }
    if(d.act==="add-counted"){
      const c = reviewQueue.find(x=>x.cid===d.cid);
      if(c.checks.verdict!=="new" && !confirm("This may already be tracked.\n\n"+c.checks.reasons.join("\n")+"\n\nAdd it anyway?")) return;
    }
    commitCandidate(d.cid,d.act); return;
  }
});
document.getElementById("scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if(e.key==="Escape") closeSheet(); });
document.addEventListener("change", e => {
  if(e.target.id!=="importFile"||!e.target.files.length) return;
  const fr = new FileReader();
  fr.onload = () => { try{
      const p = JSON.parse(fr.result); if(!p||!Array.isArray(p.items)) throw 0;
      state = p; state.uploads=state.uploads||[]; reviewQueue=[]; save(false); render(); toast("Backup imported.");
    }catch(err){ toast("That file could not be read."); } };
  fr.readAsText(e.target.files[0]);
});
boot();
</script>
